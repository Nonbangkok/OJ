services:
  backend:
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-nonbangkokgrader.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.nonbangkokgrader.com,https://nonbangkokgrader.com,https://upload.nonbangkokgrader.com}

  migrate:
    environment:
      NODE_ENV: production

  nginx-proxy:
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx-proxy/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    networks:
      - oj-network
      - tunnel-network

  cloudflared:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx-proxy:
        condition: service_healthy
    networks:
      tunnel-network:
        ipv4_address: 172.30.250.3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  tunnel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/29

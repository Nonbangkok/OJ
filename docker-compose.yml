x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
  PORT: "3000"
  SECRET_KEY: ${SECRET_KEY}
  PGHOST: database
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER}
  PGDATABASE: ${POSTGRES_DB}
  PGPASSWORD: ${POSTGRES_PASSWORD}
  NODE_ENV: ${NODE_ENV:-development}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  TRUST_PROXY: ${TRUST_PROXY:-1}

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - oj-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build: *backend-build
    image: oj-backend:${OJ_IMAGE_TAG:-local}
    depends_on:
      database:
        condition: service_healthy
    environment: *backend-environment
    command: ["node", "dist/scripts/migrate.js"]
    networks:
      - oj-network
    restart: "no"

  backend:
    build: *backend-build
    image: oj-backend:${OJ_IMAGE_TAG:-local}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    networks:
      - oj-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    cap_add:
      - "SETGID"
      - "SETUID"
    pids_limit: 256
    mem_reservation: 512m
    mem_limit: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
        REACT_APP_LARGE_UPLOAD_API_URL: ${REACT_APP_LARGE_UPLOAD_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oj-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx-proxy:
    image: nginx:1.25-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx-proxy/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - oj-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  oj-network:
    driver: bridge

volumes:
  db-data:
    driver: local

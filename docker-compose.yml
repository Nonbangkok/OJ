services:
  database:
    image: postgres:16-alpine
    container_name: oj_database
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - oj-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oj_backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - PORT=3000
      - SECRET_KEY=${SECRET_KEY}
      - PGHOST=database
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER}
      - PGDATABASE=${POSTGRES_DB}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    networks:
      - oj-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null && pg_isready -h database -U $$PGUSER -d $$PGDATABASE"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # --- A2: sandbox hardening for the code-execution container ---
    # This container compiles and runs untrusted, user-submitted C++. Limit the
    # blast radius if a submission escapes the in-process sandbox (time_wrapper
    # setrlimit + privilege drop).
    security_opt:
      # Prevent any process (incl. setuid binaries) from gaining new privileges.
      - "no-new-privileges:true"
    cap_drop:
      # Drop ALL Linux capabilities; the judge needs none of them. The wrapper
      # only needs to setuid/setgid DOWN to nobody, which does not require a
      # capability when starting from root within the container's user namespace.
      - "ALL"
    # Cap total processes/threads to contain fork bombs at the cgroup level even
    # if a submission slips past RLIMIT_NPROC.
    pids_limit: 256
    # Bound memory so a runaway compile/submission cannot OOM the host.
    # mem_reservation is the soft target; mem_limit is the hard ceiling.
    mem_reservation: 512m
    mem_limit: 1g
    # NOTE: a stronger isolation (separate judge container with
    # network_mode: none and no DB secrets) is described in SANDBOX.md.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - REACT_APP_LARGE_UPLOAD_API_URL=${REACT_APP_LARGE_UPLOAD_API_URL}
    container_name: oj_frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oj-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: oj_proxy
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy:/etc/nginx/conf.d
      - ./certbot-www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    networks:
      - oj-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: oj_cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx-proxy:
        condition: service_healthy
    networks:
      - oj-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  oj-network:
    driver: bridge

volumes:
  db-data:
    driver: local 

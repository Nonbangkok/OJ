# Trust Cloudflare's client address only when the immediate peer is the fixed
# cloudflared address on the dedicated tunnel network. Direct clients cannot
# spoof CF-Connecting-IP, and container recreation cannot change this address.
set_real_ip_from 172.30.250.3;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Only accept the forwarded scheme from the trusted tunnel peer. Direct clients
# that connect to the origin cannot spoof HTTPS and bypass the HTTP redirect.
map "$realip_remote_addr:$http_x_forwarded_proto" $upstream_forwarded_proto {
    default       $scheme;
    "172.30.250.3:http"  http;
    "172.30.250.3:https" https;
}

server {
    listen 80;
    listen 443 ssl;
    server_name nonbangkokgrader.com;

    ssl_certificate /etc/letsencrypt/live/nonbangkokgrader.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nonbangkokgrader.com/privkey.pem;

    client_max_body_size 2G;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; object-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Container healthcheck (docker-compose.yml). An exact-match location wins
    # over `location /`, so it answers directly: no upstream, no HTTP->HTTPS
    # redirect. The healthcheck must not hit "/" -- direct plain-HTTP requests
    # are redirected, and following that redirect to 127.0.0.1 fails on TLS.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Cloudflare Tunnel forwards the visitor's protocol. Redirect cleartext
        # visitors while allowing HTTPS visitors to reach this HTTP origin.
        if ($upstream_forwarded_proto = http) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://frontend:80;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /api/ {
        if ($upstream_forwarded_proto = http) {
            return 301 https://$host$request_uri;
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000/;
        proxy_buffering off;
        proxy_http_version 1.1;
        # proxy_set_header directives do NOT inherit from the server block
        # once a location defines any of its own — repeat them here so the
        # client address nginx resolved (incl. CF-Connecting-IP via real_ip)
        # is what reaches the backend, not a client-supplied XFF (AUTH-001).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Connection '';
    }
}

# Keep one canonical origin. Expire both legacy cookie scopes on the www host
# before redirecting so browsers discard either host-only or www-domain copies
# of connect.sid while retaining the canonical parent-domain cookie.
server {
    listen 80;
    listen 443 ssl;
    server_name www.nonbangkokgrader.com;

    ssl_certificate /etc/letsencrypt/live/nonbangkokgrader.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nonbangkokgrader.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Set-Cookie "connect.sid=; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/" always;
    add_header Set-Cookie "connect.sid=; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Domain=www.nonbangkokgrader.com; Path=/" always;

    return 301 https://nonbangkokgrader.com$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name upload.nonbangkokgrader.com;

    ssl_certificate /etc/letsencrypt/live/nonbangkokgrader.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nonbangkokgrader.com/privkey.pem;

    client_max_body_size 2G;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; object-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /api/ {
        if ($upstream_forwarded_proto = http) {
            return 301 https://$host$request_uri;
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000/;
        proxy_buffering off;
        proxy_http_version 1.1;
        # proxy_set_header directives do NOT inherit from the server block
        # once a location defines any of its own — repeat them here so the
        # client address nginx resolved (incl. CF-Connecting-IP via real_ip)
        # is what reaches the backend, not a client-supplied XFF (AUTH-001).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Connection '';
    }

    location / {
        if ($upstream_forwarded_proto = http) {
            return 301 https://$host$request_uri;
        }
        return 404;
    }
}

# Disposable integration stack only; never attach a real OJ database here.
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: oj_test
      POSTGRES_PASSWORD: oj_test
      POSTGRES_DB: oj_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, oj_test, -d, oj_test]
      interval: 1s
      timeout: 5s
      retries: 30
  authoring-runner:
    build:
      context: ../..
      dockerfile: backend/authoring/Dockerfile
    network_mode: none
    read_only: true
    init: true
    volumes:
      - authoring-jobs:/jobs
    tmpfs:
      - /work:rw,exec,nosuid,nodev,size=768m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - DAC_OVERRIDE
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
  tests:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      INTEGRATION_DATABASE_URL: postgres://oj_test:oj_test@database:5432/oj_test
      INTEGRATION_RUNNER_SPOOL: /jobs
      JUDGE_RUNTIME_REQUIRED: "1"
    volumes:
      - authoring-jobs:/jobs
    depends_on:
      database:
        condition: service_healthy
      authoring-runner:
        condition: service_started
    command: [npm, test, --, --runInBand, --verbose=false]

  # The judge runtime suites again, under the backend's production cap set:
  # root without CAP_KILL/CAP_DAC_OVERRIDE/CAP_FOWNER and an init that reaps
  # orphans, which is what the sandbox sweep and the uid-dropped cleanup are
  # built for. The default `tests` caps above would hide regressions there.
  # Opt-in profile, run by CI with `--profile judge run --rm judge-tests`.
  judge-tests:
    profiles: [judge]
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      INTEGRATION_DATABASE_URL: postgres://oj_test:oj_test@database:5432/oj_test
      JUDGE_RUNTIME_REQUIRED: "1"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 1g
    depends_on:
      database:
        condition: service_healthy
    command:
      - npm
      - test
      - --
      - --runInBand
      - tests/integration/(judge|sandbox|headerGrader|headerProblemFiles|backendTempPrivacy)

volumes:
  authoring-jobs:
